# FootprintX configuration.
# Secrets (API keys) do NOT belong here — put them in .env (see .env.example).
# Every value below is optional; delete a line to use the built-in default.

project:
  name: FootprintX

execution:
  concurrency: 10          # max modules running at the same time
  timeout: 15              # network request timeout (seconds)
  module_timeout: 3600     # hard cap per module (seconds)
  retries: 2
  continue_on_error: true

scope:
  # Empty include = the targets given on the command line define the authorised scope.
  # Entries may be domains (match the domain and all its subdomains) or IPs / CIDRs.
  include: []
  exclude: []

# The limits below are used as written by THOROUGH scans (--profile thorough, or option 2
# in the guided mode). QUICK scans (the default) use tighter limits for speed: top 100
# ports on up to 50 hosts, a short built-in wordlist on 3 websites, 3-minute source
# timeouts (see footprintx/core/profiles.py). Both grow with the number of domains.
modules:
  subdomains:
    enabled: true
    # amass is thorough but slow (often 10+ minutes per domain) — add it if you want it.
    sources: [subfinder, assetfinder, findomain, crtsh]
  osint:
    enabled: true
    harvester_sources: crtsh,hackertarget,rapiddns,otx,urlscan
  dns:
    enabled: true
    record_types: [A, AAAA, CNAME, MX, NS, TXT, SOA, CAA]
    resolvers: []          # e.g. [1.1.1.1, 8.8.8.8]; empty = system resolver
  ip_discovery:
    enabled: true
    max_range_hosts: 1024  # largest CIDR range that will be expanded (a /22)
  http_probe:
    enabled: true
    engine: auto           # auto = httpx-toolkit if installed, else built-in; or "native"
    threads: 25
  port_scanning:
    enabled: true
    scanner: auto          # auto (nmap, else naabu) | nmap | naabu
    top_ports: 1000
    max_hosts: 256
  technology_detection:
    enabled: true
    max_urls: 100
  web_fuzzing:
    enabled: true
    # null = auto-detect: wordlists/common.txt → SecLists (apt install seclists) → dirb lists
    wordlist: null
    extensions: []         # e.g. [php, bak, zip] — multiplies the number of requests
    match_status: [200, 204, 301, 302, 307, 401, 403]
    threads: 40
    max_targets: 10        # websites to fuzz per scan
    target_timeout: 900    # seconds per website
  shodan:
    enabled: true          # skipped automatically if SHODAN_API_KEY is not set
    max_ips: 100
  proxy:
    enabled: false
    # From inside Docker, use http://host.docker.internal:8080 to reach Burp/ZAP on the host.
    url: http://127.0.0.1:8080
    # zap = also import OWASP ZAP's passive-scan alerts via its API (ZAP_API_KEY in .env)
    api: none              # none | zap
    zap_wait: 60           # seconds to wait for ZAP's passive scanner to finish

tools:
  # Override where a tool binary is found, e.g.  httpx: /usr/bin/httpx-toolkit
  paths: {}

output:
  directory: ./results
  formats: [json, html, txt, csv]   # also available: xml
  windows_copy: true     # inside WSL: also copy reports to C:\Users\<you>\FootprintX-results

safety:
  respect_scope: true
  max_requests_per_second: 50

logging:
  level: INFO
