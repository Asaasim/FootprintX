server {
    listen 80 default_server;
    server_name lab.test www.lab.test;
    root /usr/share/nginx/html/www;
    location /files/ { autoindex on; }
    location = /go { return 302 http://www.outsider.test/stolen; }
}
server {
    listen 80;
    server_name blog.lab.test;
    root /usr/share/nginx/html/blog;
}
server {
    # every page redirects to an out-of-scope site: must never be followed
    listen 80;
    server_name shop.lab.test;
    return 302 http://www.outsider.test/from-shop;
}
