[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "footprintx"
dynamic = ["version"]
description = "Automated reconnaissance & attack surface discovery framework. Discover. Map. Secure."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jerry-Khobby" }]
keywords = ["security", "reconnaissance", "osint", "attack-surface", "pentest", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Keep in sync with requirements.txt (used for Docker layer caching).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
footprintx = "footprintx.main:run"

[tool.hatch.version]
path = "footprintx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["footprintx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: requires external tools or network access",
    "functional: end-to-end scans against controlled, authorised targets",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
